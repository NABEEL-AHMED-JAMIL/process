# Settings for the end-to-end suite, which boots the whole application against the local
# development database and drives it over real HTTP.
#
# Nothing secret is written here. The datasource credentials come from the environment, so the
# suite simply does not run unless whoever runs it supplies them -- see StackE2ETest for the
# command. Everything else is either a dummy for a service the tests never reach, or a setting
# that makes a test run behave itself.
#
# Author: Nabeel Ahmed

# The local Postgres, published on 5433 by docker-compose. Overridable for a different stack.
spring.datasource.url=${E2E_DATASOURCE_URL:jdbc:postgresql://localhost:5433/etl_job}
spring.datasource.username=${E2E_DATASOURCE_USERNAME:}
spring.datasource.password=${E2E_DATASOURCE_PASSWORD:}

# Liquibase has already run against this database; the suite must not try to migrate it again. Hibernate
# checks the schema it finds and never writes it (MIG-129).
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# The crons would otherwise dispatch real jobs while the tests are asserting on rows.
spring.task.scheduling.pool.size=1
process.scheduling.enabled=false

# The application's own key, supplied from the environment. Anything this profile encrypts has to
# be decryptable by the running application, so a test-only key would write profiles the app could
# never open. Sourced like the datasource: never stored here.
lookup.encryption.key=${E2E_LOOKUP_ENCRYPTION_KEY:}

# Signs tokens the suite mints for users it has just created, in a transaction that is rolled
# back, against a local development database. It authenticates nothing that exists outside the
# test run, and the base64 decodes to a sentence saying as much.
jwt.secret.key=ZTJlLXRlc3Qtc2lnbmluZy1rZXktbm90LWEtc2VjcmV0LTAwMDA=

# Satisfies the startup check that refuses to run with worker callbacks unauthenticated. It
# guards nothing here: this profile is never deployed, and the suite never calls those endpoints
# as a worker. Named so that nobody mistakes it for a credential.
worker.callback.token=e2e-placeholder-not-a-secret

# Services the tests never reach. Present only so the context can start.
EFS_FILE_DIRE=${java.io.tmpdir}


# Quieter output so a failure is readable.
logging.level.root=WARN
logging.level.process=INFO

# Storage is storage-service's (MIG-70): the suite reaches it on its published port, with the same
# service token the running stack uses.
storage.service-url=${E2E_STORAGE_URL:http://localhost:9120}
internal.service-token=${E2E_INTERNAL_SERVICE_TOKEN:}
