# Settings for the end-to-end suite, which boots the whole application against the local
# development database and drives it over real HTTP.
#
# Nothing secret is written here. The datasource credentials come from the environment, so the
# suite simply does not run unless whoever runs it supplies them -- see StackE2ETest for the
# command. Everything else is either a dummy for a service the tests never reach, or a setting
# that makes a test run behave itself.
#
# Author: Nabeel Ahmed

# The local Postgres, published on 5433 by docker-compose. Overridable for a different stack.
spring.datasource.url=${E2E_DATASOURCE_URL:jdbc:postgresql://localhost:5433/etl_job}
spring.datasource.username=${E2E_DATASOURCE_USERNAME:}
spring.datasource.password=${E2E_DATASOURCE_PASSWORD:}

# Liquibase has already run against this database; the suite must not try to migrate it again. Hibernate
# checks the schema it finds and never writes it (MIG-129).
spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=validate

# The crons would otherwise dispatch real jobs while the tests are asserting on rows.
spring.task.scheduling.pool.size=1
process.scheduling.enabled=false

# The application's own key and its id (MIG-5), supplied from the environment. Anything this profile
# encrypts has to be decryptable by the running application, and the stored credentials it reads were
# sealed under this key, so a test-only key would neither open them nor write anything the app could
# open. Sourced like the datasource: never stored here. lookup.encryption.key, the retired pre-MIG-5
# key, is unset in the stack now and is not read.
process.encryption.key-id=${E2E_PROCESS_ENCRYPTION_KEY_ID:}
process.encryption.key=${E2E_PROCESS_ENCRYPTION_KEY:}

# Signs tokens the suite mints for users it has just created, in a transaction that is rolled
# back, against a local development database. It authenticates nothing that exists outside the
# test run, and the base64 decodes to a sentence saying as much.
jwt.secret.key=ZTJlLXRlc3Qtc2lnbmluZy1rZXktbm90LWEtc2VjcmV0LTAwMDA=

# The suite's tokens are checked against Redis's revocation keys (TokenRevocations), the same Redis the
# stack uses (localhost:6379 from the host). Unprefixed, its keys are auth:token-version:<app user id>, and
# the ids of the users this suite creates in Core's app_user come from a sequence that overlaps
# identity-service's user ids: a key Identity raised for its user 1013 made a fresh e2e user 1013's token
# look revoked, a 401 that came and went with the sequence (ZT-AI71). Its own prefix keeps the suite out
# of the live keys both ways.
identity.token-revocations.key-prefix=e2e:

# Satisfies the startup check that refuses to run with worker callbacks unauthenticated. It
# guards nothing here: this profile is never deployed, and the suite never calls those endpoints
# as a worker. Named so that nobody mistakes it for a credential.
worker.callback.token=e2e-placeholder-not-a-secret

# Services the tests never reach. Present only so the context can start.
EFS_FILE_DIRE=${java.io.tmpdir}

# Kafka, from the host: the broker in etl-platform's compose advertises its EXTERNAL listener as
# localhost:9093; 9092 is the INTERNAL one, whose metadata names kafka:9092, a host only containers
# resolve. Producers connect lazily, so the context starts whether or not the broker is up.
# Expected at startup, and harmless: KafkaTopicProvisioner's WARN that profile 1 ('Platform default broker',
# kafka:9092) is unreachable ("No resolvable bootstrap urls"). That profile is a database row naming the
# containers' address; from the host the suite provisions no topics, which is what it should do anyway.
spring.kafka.bootstrap-servers=${E2E_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
# The event listeners stay off: they share their consumer groups with the running process_app, so a
# suite that started them would take partitions -- and the events on them -- from the live stack, and
# act on them outside the rolled-back test transaction.
identity.events.listen=false
inbox.events.listen=false
documents.events.listen=false
forms.workflow.listen=false
review.tasks.listen=false

# Quieter output so a failure is readable.
logging.level.root=WARN
logging.level.process=INFO

# Storage is storage-service's (MIG-70): the suite reaches it on its published port, with the same
# service token the running stack uses.
storage.service-url=${E2E_STORAGE_URL:http://localhost:9120}
internal.service-token=${E2E_INTERNAL_SERVICE_TOKEN:}
