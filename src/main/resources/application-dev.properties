#================================
# ==== EFS-Local-File ===========
# ===============================
storage.efsFileDire=${EFS_FILE_DIRE}
# ===============================
# = Lookup value encryption =====
# ===============================
# Base64-encoded 256-bit AES key (generate with: openssl rand -base64 32).
# Required only if you use the "Encrypt this value" option on a lookup.
lookup.encryption.key=${LOOKUP_ENCRYPTION_KEY:}
# ===============================
# = JWT auth (Phase 0) ==========
# ===============================
# Base64-encoded 256-bit HMAC key (generate with: openssl rand -base64 32).
jwt.secret.key=${JWT_SECRET_KEY:}
jwt.access-token.expiry-minutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:30}
jwt.refresh-token.expiry-days=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}
# ===============================
# = Bucket Browser storage ======
# ===============================
# Each is only required if a bucket in the BUCKET_LIST lookup is mapped to that provider.
minio.endpoint=${MINIO_ENDPOINT:}
opensearch.url=${OPENSEARCH_URL:}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.jackson.serialization.fail-on-empty-beans=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
#spring.jpa.show-sql=true
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
#===============================
# ==== Email detail ============
# ==============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ===============================
# = Liquibase  ==================
# ===============================
spring.liquibase.enabled=true
spring.liquibase.contexts=init
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Shared secret the ETL workers must send as X-Worker-Token on /changeState and /addLogs.
# Unset means those callbacks stay open (a startup WARN says so); set the same value here and
# on the workers to require it.
worker.callback.token=${WORKER_CALLBACK_TOKEN:}

# Profile pictures. One bucket for everyone: a picture belongs to the person, not the
# workspace, and a newly created tenant has no storage of its own yet.
app.avatar.bucket=${AVATAR_BUCKET:etl-avatar}
