databaseChangeLog:
  # notifications_db -- the Notifications service's own database (MIG-21). Separate from
  # db/changelog, which builds etl_job: nothing here may reference a table outside this database.
  - changeSet:
      id: notifications-1.0-notification
      author: nabeel.amd93
      description: "notification, with tenant_id NOT NULL and leading every index"
      # The move script builds the table from the same SQL before it copies the rows in, so that
      # the sequence is set before anything can write. On that database this marks itself run.
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: notification
      changes:
        - sqlFile:
            path: db/notifications/sql/V1.0-notification.sql
            splitStatements: true
            stripComments: true
