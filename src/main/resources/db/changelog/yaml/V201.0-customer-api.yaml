      id: 201.0-customer-api
      author: nabeel.amd93
      description: "MIG-332 (ADR-025): the customer API's inbound work -- api_idempotency_receipt (per client), api_intake (runs started through the API), event_route (event type -> pipeline or workflow), api_event; all under row security"
