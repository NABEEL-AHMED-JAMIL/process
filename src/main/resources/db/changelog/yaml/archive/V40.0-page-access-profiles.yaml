databaseChangeLog:
  - changeSet:
      id: 40.0-page-access-profiles
      author: nabeel.amd93
      description: "Access profiles: a named bundle of console pages per workspace, one per tenant user"
      changes:
        - sqlFile:
            path: ../changelog-sets/V40.0-page-access-profiles/V40__page_access_profiles.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE app_user DROP CONSTRAINT IF EXISTS fk_app_user_page_access_profile;
              ALTER TABLE app_user DROP COLUMN IF EXISTS page_access_profile_id;
              DROP TABLE IF EXISTS page_access_profile_page;
              DROP TABLE IF EXISTS page_access_profile;
              DROP SEQUENCE IF EXISTS page_access_profile_Seq;
