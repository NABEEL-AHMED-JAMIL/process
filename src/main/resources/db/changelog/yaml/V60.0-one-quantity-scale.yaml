databaseChangeLog:
  - changeSet:
      id: 60.0-one-quantity-scale
      author: nabeel.amd93
      description: "invoice_line quantities at the meter's scale, numeric(24,6) (MIG-197)"
      changes:
        - sqlFile:
            path: ../changelog-sets/V60.0-one-quantity-scale/V60__one_quantity_scale.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
      rollback:
        - sql:
            dbms: postgresql
            sql: |
              ALTER TABLE public.invoice_line ALTER COLUMN quantity TYPE NUMERIC(18,6);
              ALTER TABLE public.invoice_line ALTER COLUMN included_quantity TYPE NUMERIC(20,5);
              ALTER TABLE public.invoice_line ALTER COLUMN billable_quantity TYPE NUMERIC(20,5);
