databaseChangeLog:
  - changeSet:
      id: 220.0-workflow-runs
      author: nabeel.amd93
      description: "Owner 2026-10-21: a run a workflow started (job_queue.workflow_instance_id, workflow_step_key) leaves the job's lane to the other triggers; one in flight per job and request"
      changes:
        - sqlFile:
            path: ../changelog-sets/V220.0-workflow-runs/V220__workflow_runs.sql
            relativeToChangelogFile: true
            splitStatements: false
      rollback:
        - sqlFile:
            path: ../changelog-sets/V220.0-workflow-runs/V220__rollback.sql
            relativeToChangelogFile: true
            splitStatements: false
