databaseChangeLog:
  - changeSet:
      id: 83.0-one-in-flight-run-per-job
      author: nabeel.amd93
      description: "ux_job_queue_one_in_flight_per_job: one Queue/Start/Running run per job, enforced by the database rather than by a COUNT(*) (P12, MIG-113)"
      changes:
        - sqlFile:
            path: ../changelog-sets/V83.0-one-in-flight-run-per-job/V83__one_in_flight_run_per_job.sql
            relativeToChangelogFile: true
            splitStatements: true
            endDelimiter: ;
      rollback:
        - sql:
            dbms: postgresql
            sql: DROP INDEX IF EXISTS public.ux_job_queue_one_in_flight_per_job;
