databaseChangeLog:
  - changeSet:
      id: 85.0-source-job-assigned-username
      author: nabeel.amd93
      description: "source_job.assigned_username, kept by the database, so the live job-event read (fetchRunningJobEvent) is one read of Core's own tables (MIG-151)"
      # The event read ran on every job-state event and joined app_user for one column, and app_user
      # leaves Core with Identity. The username now lives on the job: written with assigned_user_id,
      # whoever writes it (Hibernate, the bulk import, backfillAssignedUserId), and refreshed by ONE
      # UPDATE when the user is renamed. That UPDATE is what a user.renamed consumer runs once the
      # directory is Identity's; until then app_user is local and a trigger on it runs it.
      changes:
        - sql:
            splitStatements: false
            sql: >
              ALTER TABLE source_job ADD COLUMN IF NOT EXISTS assigned_username VARCHAR(255);
        - sql:
            splitStatements: false
            sql: >
              UPDATE source_job j SET assigned_username = u.username FROM app_user u
              WHERE u.app_user_id = j.assigned_user_id AND j.assigned_username IS DISTINCT FROM u.username;
        - sql:
            splitStatements: false
            sql: >
              CREATE OR REPLACE FUNCTION source_job_assigned_username_on_write() RETURNS trigger AS $$
              BEGIN
                NEW.assigned_username := (SELECT u.username FROM app_user u WHERE u.app_user_id = NEW.assigned_user_id);
                RETURN NEW;
              END;
              $$ LANGUAGE plpgsql;
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER source_job_assigned_username BEFORE INSERT OR UPDATE OF assigned_user_id ON source_job
              FOR EACH ROW EXECUTE PROCEDURE source_job_assigned_username_on_write();
        - sql:
            splitStatements: false
            sql: >
              CREATE OR REPLACE FUNCTION source_job_assigned_username_on_rename() RETURNS trigger AS $$
              BEGIN
                UPDATE source_job SET assigned_username = NEW.username WHERE assigned_user_id = NEW.app_user_id;
                RETURN NULL;
              END;
              $$ LANGUAGE plpgsql;
        - sql:
            splitStatements: false
            sql: >
              CREATE TRIGGER app_user_renamed AFTER UPDATE OF username ON app_user
              FOR EACH ROW WHEN (OLD.username IS DISTINCT FROM NEW.username)
              EXECUTE PROCEDURE source_job_assigned_username_on_rename();
      rollback:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: >
              DROP TRIGGER IF EXISTS app_user_renamed ON app_user;
              DROP TRIGGER IF EXISTS source_job_assigned_username ON source_job;
              DROP FUNCTION IF EXISTS source_job_assigned_username_on_rename();
              DROP FUNCTION IF EXISTS source_job_assigned_username_on_write();
              ALTER TABLE source_job DROP COLUMN IF EXISTS assigned_username;
