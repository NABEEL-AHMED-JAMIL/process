databaseChangeLog:
  # One baseline, then everything after it.
  #
  # Until V50 this file listed V1 through V49, and it could not build an empty database. Sixteen
  # tables -- tenant, app_user, the job spine, the Kafka routing pair, the pipeline form builder,
  # storage_connection, notification, ai_agent, document_converter_task -- and twenty-three of
  # the thirty-four sequences were never created by any changeset. They existed because dev runs
  # ddl-auto=update and Hibernate made them. Stage and prod run validate, which makes nothing.
  #
  # The old header here recorded the symptom without naming it: V4-V7 were excluded because
  # they "would just fail the same way V8 originally did (ALTER against tables/columns Hibernate
  # hasn't created yet at Liquibase-run time)". That was the whole schema's condition, not four
  # changesets'. A run against an empty database reached V12 -- foreign keys on tenant and
  # app_user -- and stopped there.
  #
  # V50 is the public schema as it actually stands, captured from the only complete instance of
  # it. From here the schema is declared rather than inferred, and a new database and an old one
  # end up the same shape. V1-V49 are kept under changelog-sets/archive and yaml/archive: they
  # are the record of how this schema was arrived at, and several carry the reasoning behind a
  # column that would otherwise look arbitrary. They are no longer executed.
  #
  # Anything after V50 is an ordinary changeset again. Add it below.
  - include:
      file: db/changelog/yaml/V50.0-schema-baseline.yaml
