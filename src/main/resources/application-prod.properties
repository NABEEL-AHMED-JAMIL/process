#================================
# ==== EFS-Local-File ===========
# ===============================
storage.efsFileDire=${EFS_FILE_DIRE}
# ===============================
# = Lookup value encryption =====
# ===============================
# Base64-encoded 256-bit AES key (generate with: openssl rand -base64 32).
# Required only if you use the "Encrypt this value" option on a lookup.
lookup.encryption.key=${LOOKUP_ENCRYPTION_KEY:}
# ===============================
# = JWT auth (Phase 0) ==========
# ===============================
# Base64-encoded 256-bit HMAC key (generate with: openssl rand -base64 32).
jwt.secret.key=${JWT_SECRET_KEY:}
jwt.access-token.expiry-minutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:30}
jwt.refresh-token.expiry-days=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}
# ===============================
# = WebSocket (STOMP/SockJS) ====
# ===============================
websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost,http://localhost:8080}
# ===============================
# = Bucket Browser storage ======
# ===============================
# Each is only required if a bucket in the BUCKET_LIST lookup is mapped to that provider.
minio.endpoint=${MINIO_ENDPOINT:}
opensearch.url=${OPENSEARCH_URL:}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
aws.s3.access-key=${AWS_S3_ACCESS_KEY:}
aws.s3.secret-key=${AWS_S3_SECRET_KEY:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
# Whether a platform-level S3 connection that carries no keys of its own may fall through to the
# IAM role this process runs as. Unset means false, and a connection with no keys is refused
# rather than quietly borrowing the host's identity -- turn it on only where that role is scoped
# to the buckets those connections name.
storage.allow-instance-role=${STORAGE_ALLOW_INSTANCE_ROLE:false}
# ===============================
# = AI agent endpoints ==========
# ===============================
# Comma-separated hosts an agent may be pointed at over a private address or over plain http;
# anything else has to be a public https host. Unset means just the name below, which is the one
# the server already reaches for its own Ollama -- a self-hosted model server living anywhere
# else (localhost, a 10.x/192.168.x address, an internal DNS name) has to be named here or every
# agent using it is refused at save and at run.
ai.allowed-endpoint-hosts=${AI_ALLOWED_ENDPOINT_HOSTS:host.docker.internal}
# ===============================
# = Kafka connection profiles ===
# ===============================
# Where truststores and keystores downloaded for a connection profile are cached. The app creates
# the directory 0700, but unset this lands in the JVM temp dir, which everything else on the host
# shares; point KAFKA_SECRET_CACHE_DIR at a directory of this application's own -- ideally a
# mount that is not world-traversable -- since these are real private keys on disk.
kafka.secret-cache.dir=${KAFKA_SECRET_CACHE_DIR:}
# The single directory a profile may name a truststore or keystore in without a storage bucket,
# i.e. as a plain path on this host. Unset -- the default -- means no bucket-less store path is
# accepted at all and the stores must be objects in a storage connection, which is the intended
# setup; anything named here is handed straight to the Kafka client, so it must hold nothing but
# those stores.
kafka.ssl.local-store-dir=${KAFKA_SSL_LOCAL_STORE_DIR:}
# Replication factor for topics this application auto-creates. -1 asks the broker for its own
# default.replication.factor, so the cluster answers rather than a number pinned here that would
# fail topic creation outright on a cluster with fewer brokers than it names. Unset means 1 --
# an auto-created topic with a single replica, silently unreplicated.
kafka.topic.default-replication-factor=${KAFKA_TOPIC_DEFAULT_REPLICATION_FACTOR:-1}
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.jackson.serialization.fail-on-empty-beans=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
#spring.jpa.show-sql=true
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Hibernate ddl auto (create, create-drop, validate, update)
# Liquibase below owns the production schema. "update" let the entity model quietly issue its own
# ALTER TABLE alongside the changelog, leaving a schema no changeset describes and no rollback
# undoes; "validate" keeps the drift but turns it into a startup failure instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
#===============================
# ==== Email detail ============
# ==============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ===============================
# = Liquibase  ==================
# ===============================
spring.liquibase.enabled=true
spring.liquibase.contexts=init
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Shared secret the ETL workers must send as X-Worker-Token on /changeState and /addLogs.
# Required: the application refuses to start without it, because those callbacks are outside the
# JWT chain and this is the only thing authenticating them. Same value here and on the workers.
worker.callback.token=${WORKER_CALLBACK_TOKEN:}

# Password the seeded Platform Admin account ("admin@platform.local") is created with. Only read
# on the first boot against an empty database; the account must change it at first login. No
# default -- with nothing set, no platform admin is seeded at all.
platform.admin.bootstrap-password=${PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}

# Profile pictures. One bucket for everyone: a picture belongs to the person, not the
# workspace, and a newly created tenant has no storage of its own yet.
app.avatar.bucket=${AVATAR_BUCKET:etl-avatar}
