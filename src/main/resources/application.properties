# -------------------------
# Server Detail
# http://localhost:9098/api/v1/actuator
# -------------------------
server.port=9098
server.servlet.context-path=/api/v1
spring.profiles.active=dev
# -------------------------
# Actuator Endpoints
# -------------------------
# Only health/info/metrics/prometheus are exposed over HTTP -- env/heapdump/threaddump/beans/etc
# can leak secrets (JWT signing key, encryption key, DB/mail/Kafka credentials) and shutdown can
# kill the process; none of those are needed by anything that calls this API today. If a specific
# one is genuinely needed later, add it here explicitly rather than reopening exposure to "*".
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
# The mail indicator pings the configured SMTP host on every /actuator/health check and rolls its
# result into the aggregate status. A sandbox/test SMTP account being over quota or unreachable
# would then mark this whole container "unhealthy" (and get it cycled by anything watching Docker
# health) even though mail is a non-critical side feature and every other component -- db,
# diskSpace, redis -- is actually fine. Excluded from the aggregate for that reason; mail send
# failures are still logged wherever the app actually tries to send, they just don't flip the
# container's health status.
management.health.mail.enabled=false
# -------------------------
# Process: Custom Info
# -------------------------
management.info.app.name=ETL Process
management.info.app.version=1.0.0
management.info.app.description=This is bulk engine to run the Kafka source job.
# -------------------------
# Metrics Configuration
# -------------------------
management.metrics.export.simple.enabled=true
management.metrics.enable-all=true
# -------------------------
# Bucket Browser file upload
# -------------------------
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# -------------------------
# Document Converter (JODConverter -> the LibreOffice installed in the Docker image)
# -------------------------
# office-home: where apt installs libreoffice-core on Debian/Ubuntu (Dockerfile's base image).
# port-numbers: one local LibreOffice listener process; max-tasks-per-process recycles it after
# that many conversions -- LibreOffice's own process leaks memory over a long-running listener,
# recycling is the standard mitigation rather than something specific to this app.
# working-dir: explicit writable profile dir for the LibreOffice user profile JODConverter
# creates on start -- /tmp is already a VOLUME in the Dockerfile, so this can't land somewhere
# read-only depending on how the container ends up run.
# existing-process-action=kill: if a previous container run left a soffice.bin still bound to
# port-numbers (an unclean restart, container killed mid-conversion), start cleanly by killing
# it instead of failing to start at all.
# task-queue-timeout: how long a conversion request waits for a free office process before
# failing outright -- 90s (not this library's stock default) gives a burst of concurrent
# conversions room to queue behind the single listener process above instead of erroring under
# load that would otherwise clear in a few seconds.
# Settings here (existing-process-action/working-dir/timeouts) follow the values already proven
# in production by github.com/NABEEL-AHMED-JAMIL/RAAD-Converter's own JODConverter setup.
jodconverter.local.enabled=true
jodconverter.local.office-home=/usr/lib/libreoffice
jodconverter.local.port-numbers=2002
jodconverter.local.working-dir=/tmp
jodconverter.local.existing-process-action=kill
jodconverter.local.process-timeout=180000
jodconverter.local.process-retry-interval=1000
jodconverter.local.max-tasks-per-process=100
jodconverter.local.task-execution-timeout=140000
jodconverter.local.task-queue-timeout=90000
# TEXT -> HTML exports embed images inline (base64) instead of writing sibling image files --
# an HTML output saved/downloaded standalone would otherwise reference image files that were
# never actually produced alongside it.
jodconverter.local.format-options.html.store.TEXT.FilterOptions=EmbedImages