# -------------------------
# Server Detail
# http://localhost:9098/api/v1/actuator
# -------------------------
server.port=9098
server.servlet.context-path=/api/v1
spring.profiles.active=dev
# Request paths are matched as Spring Boot 2.3 matched them (MIG-204). Boot 2.6 made PathPatternParser the
# default; springfox 2.9.2 (SwaggerConfig) reads the Ant-style patterns condition and fails to start without it,
# and keeping AntPathMatcher leaves every existing mapping and security matcher meaning exactly what it did.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
# -------------------------
# Actuator Endpoints
# -------------------------
# Only health/info/metrics/prometheus are exposed over HTTP -- env/heapdump/threaddump/beans/etc
# can leak secrets (JWT signing key, encryption key, DB/mail/Kafka credentials) and shutdown can
# kill the process; none of those are needed by anything that calls this API today. If a specific
# one is genuinely needed later, add it here explicitly rather than reopening exposure to "*".
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.shutdown.enabled=false
management.endpoint.health.show-details=when-authorized
# -------------------------
# Kafka consumers (event audit E6)
# -------------------------
# A listener starting before its topic exists must not create it with the broker's defaults (one partition, delete
# policy -- the identity and workflow topics are compacted); the producing side declares every topic.
spring.kafka.consumer.properties.allow.auto.create.topics=false
# -------------------------
# Process: Custom Info
# -------------------------
management.info.app.name=ETL Process
management.info.app.version=1.0.0
management.info.app.description=This is bulk engine to run the Kafka source job.
# -------------------------
# Metrics Configuration
# -------------------------
management.metrics.export.simple.enabled=true
management.metrics.enable-all=true
# -------------------------
# Bucket Browser file upload
# -------------------------
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# -------------------------
# Media & Documents
# -------------------------
# LibreOffice, conversion, extraction and transcription moved to media-service (MIG-48); process
# reaches Media only through MediaPort, whose implementation (HttpMedia) calls it here.
media.url=${MEDIA_URL:http://media:9110}

# Spring's scheduler defaults to a single thread, and every @Scheduled method in the app shares
# it. That put five jobs on one thread: the two ETL crons that must tick every minute
# (addJobInQueue, startJobInCurrentTimeSlot) queued behind pollDueQuerySchedules, which runs
# user SQL against remote databases for every due schedule in turn, and behind the four-hourly
# OpenSearch audit sync. Because @Scheduled(fixedDelay=...) only starts counting once the
# previous run returns, a slow query sweep did not merely delay the minute crons -- it stopped
# them for its whole duration, leaving jobs sitting un-started.
# One thread per cron, so a slow one can no longer hold up the rest.
spring.task.scheduling.pool.size=${SCHEDULER_POOL_SIZE:5}

# -------------------------
# Pipelines as ordered steps (MIG-230)
# -------------------------
# The step engine's threads: how many runs of step pipelines one replica runs at once (each try of a step gets a
# thread of its own besides, so a timeout can interrupt it). Runs of legacy pipelines never use them.
process.pipeline.engine.threads=${PROCESS_PIPELINE_ENGINE_THREADS:4}
# MIG-326: how long after one pre-dispatch pass ends the next begins (PreDispatchCron). A step pipeline's run waits for a
# pass before the engine takes it: at 10 s an API-started run took 7-10 s end to end for 50 ms of work.
process.predispatch.delay-ms=${PROCESS_PREDISPATCH_DELAY_MS:2000}
# Where a run's datasets are kept between its steps: blank is the JVM's temporary directory's etl-datasets. A run's
# steps all run on one replica, so a local directory is enough until datasets move to the platform bucket.
process.pipeline.datasets.dir=${PROCESS_PIPELINE_DATASETS_DIR:}
# MIG-344: each step-pipeline run's memory budget: what the rows its steps hold at once may take. A streaming step holds a
# batch of batch-rows rows; an aggregate spills its groups to disk past the budget. engine.threads x this must stay well
# inside the heap (4 x 256 MB of a 1.2 GB heap).
process.pipeline.run-memory-mb=${PROCESS_PIPELINE_RUN_MEMORY_MB:256}
process.pipeline.batch-rows=${PROCESS_PIPELINE_BATCH_ROWS:1024}

# MIG-204: Boot 2.5+ drops "message" from its own error answer by default; the console and api-check read it (Boot 2.3 envelope).
server.error.include-message=always
