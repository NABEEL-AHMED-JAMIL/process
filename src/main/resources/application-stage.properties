#================================
# ==== EFS-Local-File ===========
# ===============================
storage.efsFileDire=${EFS_FILE_DIRE}
# ===============================
# = Lookup value encryption =====
# ===============================
# Secrets (encrypted lookups, Kafka passwords) are sealed under process.encryption.key, a
# Base64-encoded 256-bit AES key (openssl rand -base64 32), tagged with its id (MIG-5).
# lookup.encryption.key is the retired key: it only opens what it sealed, until EncryptionReseal
# reports nothing left under it, and is then unset.
lookup.encryption.key=${LOOKUP_ENCRYPTION_KEY:}
process.encryption.key-id=${PROCESS_ENCRYPTION_KEY_ID:}
process.encryption.key=${PROCESS_ENCRYPTION_KEY:}
process.encryption.required=true
# ===============================
# = JWT auth (Phase 0) ==========
# ===============================
# Base64-encoded 256-bit HMAC key (generate with: openssl rand -base64 32).
jwt.secret.key=${JWT_SECRET_KEY:}
jwt.access-token.expiry-minutes=${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:30}
jwt.refresh-token.expiry-days=${JWT_REFRESH_TOKEN_EXPIRY_DAYS:7}
# ===============================
# = WebSocket (STOMP/SockJS) ====
# ===============================
# ===============================
# = Platform storage & AWS ======
# ===============================
# One AWS identity for everything the platform itself does there: outbound mail through SES and
# the platform buckets (app.avatar.bucket and app.config.bucket, below) on S3. Tenants' own buckets are not configured
# here at all -- each is a storage connection added from Settings > Storage, carrying its own
# credentials -- so the MINIO_*, AWS_S3_* and AZURE_* variables that used to sit here are gone.
#
# Leave the keys blank on a deployment whose instance role covers SES and the bucket (see
# storage.allow-instance-role for the bucket half). Set the endpoint only for an emulator: it
# points both SES and S3 at LocalStack, where mail is stored rather than delivered.
aws.region=${AWS_REGION:us-east-1}
aws.endpoint=${AWS_ENDPOINT:}
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
opensearch.url=${OPENSEARCH_URL:}
# Whether a platform-level S3 connection that carries no keys of its own may fall through to the
# IAM role this process runs as. Unset means false, and a connection with no keys is refused
# rather than quietly borrowing the host's identity -- turn it on only where that role is scoped
# to the buckets those connections name.
storage.allow-instance-role=${STORAGE_ALLOW_INSTANCE_ROLE:false}
# ===============================
# = AI agent endpoints ==========
# ===============================
# Comma-separated hosts an agent may be pointed at over a private address or over plain http;
# anything else has to be a public https host. Unset means just the name below, which is the one
# the server already reaches for its own Ollama -- a self-hosted model server living anywhere
# else (localhost, a 10.x/192.168.x address, an internal DNS name) has to be named here or every
# agent using it is refused at save and at run.
# ===============================
# = Kafka connection profiles ===
# ===============================
# Where truststores and keystores downloaded for a connection profile are cached. The app creates
# the directory 0700, but unset this lands in the JVM temp dir, which everything else on the host
# shares -- a deployment holding real key material should give it a directory of its own.
kafka.secret-cache.dir=${KAFKA_SECRET_CACHE_DIR:}
# The single directory a profile may name a truststore or keystore in without a storage bucket,
# i.e. as a plain path on this host. Unset -- the default -- means no bucket-less store path is
# accepted at all and the stores must be objects in a storage connection, which is the intended
# setup; anything named here is handed straight to the Kafka client, so it must hold nothing but
# those stores.
kafka.ssl.local-store-dir=${KAFKA_SSL_LOCAL_STORE_DIR:}
# Replication factor for topics this application auto-creates. Unset means 1, which is right for
# the single broker a local or shared dev stack runs and wrong on a real cluster.
kafka.topic.default-replication-factor=${KAFKA_TOPIC_DEFAULT_REPLICATION_FACTOR:1}
# ===============================
# = DATA SOURCE
# ===============================
# Set here configurations for the database connection
spring.jackson.serialization.fail-on-empty-beans=false
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# MIG-22 part 4: notifications-service redeems a welcome mail's secretRef here with this token
# (blank = the endpoint is shut), and fetches shared files from this bucket.
internal.service-token=${INTERNAL_SERVICE_TOKEN:}
app.mail-attachments.bucket=${APP_MAIL_ATTACHMENTS_BUCKET:etl-mail-attachments}
# Keep the connection alive if idle for a long time (needed in production)
spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1
# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
#spring.jpa.show-sql=true
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
# Hibernate ddl auto (create, create-drop, validate, update)
# Liquibase below owns this schema as it does prod's. "update" let the entity model quietly
# issue its own ALTER TABLE alongside the changelog, leaving a schema no changeset describes
# and no rollback undoes; "validate" keeps the drift but turns it into a startup failure --
# and stage is where a changeset missing from a release has to be found, not prod.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=true
#===============================
# ==== Email detail ============
# ==============================
# ===============================
# = Liquibase  ==================
# ===============================
spring.liquibase.enabled=true
spring.liquibase.contexts=init
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
# Worker callbacks (/changeState, /addLogs, /addLogsBatch) are proved by a token minted per
# run at dispatch: it travels to the worker inside the run's message and comes back as
# X-Worker-Token, checked against a hash on the job_queue row (see RunCallbackTokens). Nothing
# needs to be configured for that. The shared secret below is honoured only for a run that was
# dispatched before per-run tokens existed and carries no hash; leave it set until every worker
# echoes the run token, then remove it and that path closes on its own.
worker.callback.token=${WORKER_CALLBACK_TOKEN:}
# How long a run's token stays good after dispatch, whatever the run does -- a backstop for a run
# that never reports, not a run timeout.
worker.callback.budget-hours=${WORKER_CALLBACK_BUDGET_HOURS:24}

# Password the seeded Platform Admin account ("admin@platform.local") is created with. Only read
# on the first boot against an empty database; the account must change it at first login. No
# default -- with nothing set, no platform admin is seeded at all, so a first run against a fresh
# database comes up with no account to sign in as until this is supplied and the app restarted.
platform.admin.bootstrap-password=${PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:}

# The platform's two buckets, on S3 under the aws.* identity above, each seeded as a storage
# connection on first boot. Anything else a workspace needs is a connection it adds itself from
# Settings > Storage.
# Profile pictures, at <userId>/profile/. One bucket for everyone, because a picture belongs to
# the person, not the workspace, and a newly created tenant has no storage of its own yet.
app.avatar.bucket=${AVATAR_BUCKET:etl-avatar}
# Configuration the platform keeps for tenants: Kafka certificates and the stores built from
# them, at kafka-secrets/, where no tenant's own credentials can reach them.
app.config.bucket=${CONFIG_BUCKET:etl-config}

# ---- outbound mail ----------------------------------------------------------------------
# Sent by notifications-service since MIG-22; process only stages attachments and keeps secrets.

# The metering service (etl_meter). Blank = no metering; the console runs as before.
meter.url=${METER_URL:}
meter.service-key=${METER_SERVICE_KEY:}
# Usage the meter cannot take yet, and (under dead/) what it refused (MIG-15).
meter.spool-dir=${METER_SPOOL_DIR:${java.io.tmpdir}/process-meter-spool}

# The AI service (ADR-020): prompts, model connections and prompt runs.
ai.url=${AI_URL:http://ai:9150}
