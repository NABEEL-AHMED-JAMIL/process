version: '3.8'

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  redis_data:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-nabeel.amd93}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-etl_job}
    ports:
      # Host port 5433 -> container 5432 -- the host machine may already have its own Postgres
      # on 5432 (e.g. a Homebrew/Postgres.app install for other projects); the app itself never
      # uses this host mapping (SPRING_DATASOURCE_URL connects via the Docker network hostname
      # "postgres:5432", not localhost), so this only affects external tools (a GUI client, psql
      # from the host) -- point those at localhost:5433 instead.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-nabeel.amd93}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      zookeeper:
        condition: service_started
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Expose two listeners: INTERNAL for container-to-container, EXTERNAL for host access
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093
      # Advertise INTERNAL as kafka:9092 for other containers, and advertise EXTERNAL as localhost:9093 for host clients
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "9093:9093"

  # Redis -- backs the per-user WebSocket presence registry (WebSocketPresenceService) and
  # general read-heavy caching (CacheConfig). Persisted (appendonly) so presence/cache survive
  # a container restart rather than silently going cold.
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  process_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: process_app
    restart: always
    ports:
      - "9098:9098"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/etl_job
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-nabeel.amd93}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-admin}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      EFS_FILE_DIRE: ${EFS_FILE_DIRE:-/tmp/efs}
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-ce545af2135fd6}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-35f35312703886}
      # Base64-encoded 256-bit AES key for encrypted lookup values (openssl rand -base64 32).
      # Rotating this makes any already-encrypted lookup values undecryptable -- override via
      # a real LOOKUP_ENCRYPTION_KEY env var rather than editing this fallback once real
      # encrypted data exists.
      LOOKUP_ENCRYPTION_KEY: ${LOOKUP_ENCRYPTION_KEY:-RACT0Saglm5Lastgky0Z3RgMXiZbSjxiNvgbnQDtMwc=}
      # Base64-encoded 256-bit HMAC key for signing JWTs (openssl rand -base64 32). Rotating
      # this invalidates every already-issued token (everyone gets logged out) -- override via
      # a real JWT_SECRET_KEY env var in any environment with real users.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4z8qN3vW9pT2xR7mK5jL1sC6bF0yH8dQ4nE9tV2rU7w=}
      # Bucket Browser storage (MinIO reached via the host, since it's a separate compose
      # project's container; only required if a bucket in the BUCKET_LIST lookup uses it)
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://host.docker.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-us-east-1}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - /tmp/efs:/tmp/efs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9098/api/v1/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
