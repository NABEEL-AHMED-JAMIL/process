# MIG-132: round-robin in front of process A and B. No ip_hash, no hash, no sticky cookie: every
# request goes to the next instance in turn, so nothing a request leaves in one JVM is found by the
# next one unless it was shared. X-Upstream names the instance that answered, so the harness can
# prove the alternation instead of assuming it.
worker_processes 1;
pid /tmp/mig132-nginx.pid;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream process {
        server process-a:9098 max_fails=1 fail_timeout=3s;
        server process-b:9098 max_fails=1 fail_timeout=3s;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 9098;
        client_max_body_size 50m;

        location / {
            proxy_pass http://process;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout;
            proxy_read_timeout 120s;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
